name: Android CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-debug-build:
    name: 静态检查 + Debug 构建
    # 打标签发布时跳过本任务
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: TypeScript 检查
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: 单元测试
        run: pnpm test

      - name: 构建 Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoScroller-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  release:
    name: 发布 Release APK
    # 仅在推送 v* 标签时执行
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Release APK
        run: cd android && ./gradlew assembleRelease

      - name: 重命名 APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AutoScroller-${{ github.ref_name }}.apk

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AutoScroller-*.apk
          generate_release_notes: true
